name: release-gui

on:
  push:
    tags:
      - "gui-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "GUI version to build, without the leading v. Required when uploading a release."
        required: false
        type: string
      upload_release:
        description: "Create or update the GitHub Release."
        required: false
        default: true
        type: boolean
      draft:
        description: "Create a draft release for manual runs."
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: meta
        run: |
          $eventName = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          $manualVersion = "${{ inputs.version }}".Trim()
          $manualUpload = "${{ inputs.upload_release }}" -eq "true"
          $manualDraft = "${{ inputs.draft }}" -eq "true"
          $manualPrerelease = "${{ inputs.prerelease }}" -eq "true"

          $packageJson = Get-Content -Raw "packages/gui/package.json" | ConvertFrom-Json
          $version = $packageJson.version
          $tag = "gui-v$version"
          $uploadRelease = $false
          $draft = $false
          $prerelease = $false

          if ($eventName -eq "push" -and $refName.StartsWith("gui-v")) {
            $version = $refName.Substring(5)
            $tag = $refName
            $uploadRelease = $true
          } else {
            if ($manualVersion -ne "") {
              $version = $manualVersion
              $tag = "gui-v$version"
            }

            if ($manualUpload -and $manualVersion -eq "") {
              throw "The version input is required when upload_release is true."
            }

            $uploadRelease = $manualUpload
            $draft = $manualDraft
            $prerelease = $manualPrerelease
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Resolved GUI version is empty."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "upload_release=$($uploadRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "draft=$($draft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Sync GUI version
        env:
          GUI_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GUI_VERSION)) {
            throw "Resolved GUI version is empty."
          }

          $packageJsonPath = "packages/gui/package.json"
          $packageJson = Get-Content -Raw $packageJsonPath | ConvertFrom-Json
          $packageJson.version = $env:GUI_VERSION
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content -NoNewline $packageJsonPath

          $tauriConfigPath = "packages/gui/src-tauri/tauri.conf.json"
          $tauriConfig = Get-Content -Raw $tauriConfigPath | ConvertFrom-Json
          $tauriConfig.version = $env:GUI_VERSION
          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content -NoNewline $tauriConfigPath

          $cargoTomlPath = "packages/gui/src-tauri/Cargo.toml"
          $cargoToml = Get-Content -Raw $cargoTomlPath
          $cargoToml = $cargoToml -replace '(?m)^version = "[^"]+"', "version = `"$env:GUI_VERSION`""
          Set-Content -NoNewline -Path $cargoTomlPath -Value $cargoToml

      - name: Typecheck GUI
        run: bun --cwd packages/gui typecheck

      - name: Build OpenCode backend sidecar
        run: bun --cwd packages/opencode script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Stage OpenCode backend sidecar
        run: |
          $source = "packages/opencode/dist/opencode-windows-x64/bin/opencode.exe"
          if (-not (Test-Path $source)) {
            throw "OpenCode backend sidecar was not built at $source."
          }

          $targetDir = "packages/gui/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -Path $source -Destination "$targetDir/opencode-server-x86_64-pc-windows-msvc.exe" -Force

          & "$targetDir/opencode-server-x86_64-pc-windows-msvc.exe" --version

      - name: Build Tauri Windows installer
        run: bun --cwd packages/gui tauri:build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: opencode-gui-windows-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: |
            packages/gui/src-tauri/target/release/bundle/nsis/*.exe
            packages/gui/src-tauri/target/release/bundle/nsis/*.zip
            packages/gui/src-tauri/target/release/bundle/nsis/*.sig

      - name: Upload assets to GitHub Release
        if: steps.meta.outputs.upload_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $title = "OpenCode GUI $version"
          $repo = $env:GITHUB_REPOSITORY

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @(
              "release",
              "create",
              $tag,
              "--target",
              $env:GITHUB_SHA,
              "--title",
              $title,
              "--notes",
              "OpenCode GUI Windows release.",
              "--repo",
              $repo
            )

            if ("${{ steps.meta.outputs.draft }}" -eq "true") {
              $releaseArgs += "--draft"
            }

            if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
              $releaseArgs += "--prerelease"
            }

            gh @releaseArgs
          }

          $assetDir = "packages/gui/src-tauri/target/release/bundle/nsis"
          $assets = Get-ChildItem -Path $assetDir -File -ErrorAction Stop |
            Where-Object { $_.Extension -in ".exe", ".zip", ".sig" }

          if (-not $assets) {
            throw "No release assets found in $assetDir."
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --clobber --repo $repo
          }
